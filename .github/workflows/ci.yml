# Windows only: every pillar is a Windows API.
#
# What runs where, and why:
#
# - `dq`'s tests bootstrap the Windows App SDK 2.x runtime, which hosted
#   runners lack, so every job that tests `dq` installs it first
#   (`.github/actions/windows-app-runtime`). Those jobs also run with
#   `--test-threads=1`, the repository's convention for `dq`: a
#   `DispatcherQueue` test is only sound alone, and `DQ_TEST_LOCK` is a
#   backstop, not the plan.
# - Hyper-V socket tests skip themselves where the AF_HYPERV provider is
#   absent, which on a hosted runner is the usual case.
# - `tests/racedll.rs` only exists in release builds (a debug server DLL
#   aborts on the forced unload it performs), hence the release leg.
# - The integration tests build the server DLL themselves (`cargo build -p
#   winasync-dll`) and write, then remove, per-user HKCU class keys.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.profile }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - uses: ./.github/actions/windows-app-runtime
      - name: cargo test (every feature)
        shell: bash
        run: |
          flag=""
          [ "${{ matrix.profile }}" = release ] && flag="--release"
          cargo test $flag --all-features -- --test-threads=1

  # Each pillar on its own. These builds have broken independently of the
  # all-features one before: a feature quietly relying on a `windows`
  # module only another feature enabled.
  features:
    name: test (${{ matrix.features }} only)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        features: [comio, tp, rio, "tp,rio", dq]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Not the feature list itself: rust-cache rejects a key with commas.
          key: features-${{ strategy.job-index }}
      - if: contains(matrix.features, 'dq')
        uses: ./.github/actions/windows-app-runtime
      - shell: bash
        run: |
          threads=""
          case "${{ matrix.features }}" in *dq*) threads="-- --test-threads=1";; esac
          cargo test --no-default-features --features "${{ matrix.features }}" $threads

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (whole workspace, every feature, dq included)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: rustdoc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: server DLL
        run: cargo build -p winasync-dll --release
