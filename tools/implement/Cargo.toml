[package]
name = "winasync-implement"
version = "0.1.0"
edition = "2021"
publish = false
description = "windows-implement 0.60.2 with one change: IInspectable::GetIids answers with the implemented interfaces' IIDs"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
syn = { version = "2.0", default-features = false, features = ["parsing", "proc-macro", "printing", "full", "clone-impls"] }
