[package]
name = "winasync-ps"
version = "0.1.0"
edition = "2024"
publish = false
description = "The proxy/stub that marshals winasync's WinRT interfaces between processes."

# What lets a client in one process call an object in another. Every
# interface in `Pbk20191.WinAsync.Comio` -- and the three parameterized
# instances the surface uses -- has its proxy and stub here, generated by
# `midl` from the `.winmd` (`cargo run -p winmdgen`).
#
# Its own DLL rather than part of `winasync.dll`, which is the conventional
# shape for a MIDL proxy and here also the necessary one: the out-of-process
# server loads the proxy/stub too, to build the stubs its objects are called
# through. Were the proxies inside `winasync.dll`, that server -- which links
# the library statically -- would load a second copy of the whole library,
# with its own statics, `DllMain` and Winsock reference. This DLL is C and a
# few lines of Rust, and nothing else.
[lib]
name = "winasync_ps"
crate-type = ["cdylib"]
path = "src/lib.rs"

[build-dependencies]
cc = "1.2"
