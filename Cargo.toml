[package]
name = "winasync"
version = "0.1.0"
edition = "2024"
description = "Windows async engine concepts: the Win32 thread pool, DispatcherQueue, Registered I/O, and a WinRT component for the transports WinRT has no class for."
# The crate is `winasync`; the repository carries the `-rs` suffix the Rust
# ecosystem uses to disambiguate a language binding from the thing it binds
# (`windows-rs`, `serde-rs`). crates.io and GitHub name things separately and
# there is no reason to force them together.
repository = "https://github.com/pbk20191/winasync-rs"

# `tools/winmdgen` compiles the RDL in `metadata/` into the published `.winmd`
# and regenerates `src/comio/bindings.rs`. A workspace member rather than a
# build-dependency: it is run by hand (`cargo run -p winmdgen`), its outputs
# are checked in, and keeping `windows-rdl` out of the library's graph is what
# stops an ordinary build from paying for it.
[workspace]
members = ["dll", "tools/winmdgen"]

# No `[lib] crate-type` here: this package is an rlib and nothing else.
#
# It used to be `["lib", "cdylib"]`, which made one rustc invocation emit both
# the library and the COM server DLL. That left nothing to tell them apart --
# there is no `cfg` for crate type, `required-features` does not apply to
# `[lib]`, and build scripts cannot see it -- so "only the DLL has the
# exports" and "only the DLL keeps the unload counts" were conventions. The
# server now lives in `dll/` (package `winasync-dll`), whose only crate type is
# `cdylib`. Building it is the only way to get the exports, which turns the
# convention into a fact about the build.

# The demos are examples, one per engine, so each declares the features it
# needs and a build without them simply skips it. There is no bin: a
# library crate's consumers should not compile a demo, nor run a build
# script that only existed to embed the demo's manifest.
[[example]]
name = "tp"
required-features = ["tp"]

[[example]]
name = "dq_controller"
required-features = ["dq"]

[[example]]
name = "dq_named_pipe"
required-features = ["tp", "comio", "dq"]

[dependencies]
windows-core = "0.62.2"

[dependencies.windows-link]
version = "0.2"

# `windows` is a base dep, but its feature surface is activated per crate-feature
# (tp / comio / dq) below — so e.g. a `tp`-only build pulls only the Win32 bits.
[dependencies.windows]
version = "0.62.2"
default-features = false
features = []

# Test-only Windows APIs, scoped here so the library never carries them.
#
# Registry and LibraryLoader are for the comio tests, which load the real DLL
# and write the CLSID keys an installer would. They used to sit on `comio`
# itself, which made every consumer of the rlib compile them for nothing.
#
# `tests/activation.rs` loads the reg-free manifest with `CreateActCtxW` /
# `ActivateActCtx`, the run-time form a host like `python.exe` needs. The
# library itself never calls them -- the manifest is something a *consumer*
# activates -- so the feature has no business on `comio`. It used to arrive
# by accident through `tp` and `dq`, which left a `comio`-only test build
# unable to compile.
[dev-dependencies.windows]
version = "0.62.2"
default-features = false
features = [
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
]

# `dq`'s tests await an `IAsyncOperation` to prove a wake from a pool thread
# resumes on the queue thread; the library itself never needs the crate.
[dev-dependencies.windows-future]
version = "0.3.2"

[dependencies.windows-future]
version = "0.3.2"
optional = true

# `UI_Dispatching` is the only part of WinUI that `dq` touches: the queue, its
# controller and its timer. `UI_Xaml` and `UI_Composition` would each drag in
# dozens of `windows` namespaces for nothing.
[dependencies.winio-winui3]
version = "0.4.0"
features = ["UI_Dispatching"]
optional = true

[dependencies.futures-io]
version = "0.3"
optional = true

# `Bytes` / `BytesMut` as owned IO buffers (`common::buffer`).
[dependencies.bytes]
version = "1"
optional = true

[features]
default = ["tp", "dq", "comio"]

# Win32 thread-pool async runtime. Standalone: no winui3 / windows-future.
tp = [
    # Serial ports: `DCB`, `COMMTIMEOUTS`, `WaitCommEvent`.
    "windows/Win32_Devices_Communication",
    "windows/Win32_Foundation",
    "windows/Win32_Security",
    "windows/Win32_Security_Authorization",
    "windows/Win32_System_Threading",
    "windows/Win32_System_IO",
    "windows/Win32_Storage_FileSystem",
    "windows/Win32_Networking_WinSock",
    "windows/Win32_System_Pipes",
    "windows/Win32_System_Memory",
    "windows/Win32_System_SystemInformation",
    "windows/Win32_System_ApplicationInstallationAndServicing",
]

# WinRT-shaped COM streams over overlapped IO.
comio = [
    "dep:windows-future",
    # No `windows-threading`: its `submit` queues with a null callback
    # environment and no count, and `comio::pool::submit` replaced it so that
    # every work item is both counted and pinned in the server DLL.
    "windows/Foundation",
    "windows/Storage_Streams",
    "windows/Win32_Foundation",
    "windows/Win32_System_Threading",
    "windows/Win32_System_IO",
    "windows/Win32_Storage_FileSystem",
    "windows/Win32_Networking_WinSock",
    "windows/Win32_System_Pipes",
    "windows/Win32_System_WinRT",
    "windows/Win32_Security",
    # SDDL parsing and SID strings, for listener security and peer identity.
    "windows/Win32_Security_Authorization",
    # The activation path: class factories and the entry points COM finds
    # them through.
    "windows/Win32_System_Com",
]

# Diagnostic counters: live op blocks, inline completions, pump releases.
#
# Off by default, and off is the point. Each one is a process-wide mutable
# static — the kind of state a library should not carry unasked, because it is
# shared by every consumer in the process and by every test running in
# parallel. The crate's own unit tests switch them on through `cfg(test)`, so
# this feature exists for the other case: turning them back on in a release
# build to diagnose something.
#
# `dylib` implies the one it needs. `LIVE_OPS` is not only a diagnostic there:
# `comio::unload::can_unload` reads it to decide whether an operation is still
# in flight, and a counter that does not exist cannot answer that.
counters = []

# Compiled for the in-process server DLL. **Do not enable this yourself** --
# `dll/` (package `winasync-dll`) enables it through its dependency
# declaration, and that is the only place it should come from. Cargo has no
# private features, so this cannot be enforced; what is enforced is that the
# entry points it exposes are `unsafe fn`, so turning it on reaches nothing
# unsound from safe code.
#
# What it turns on is the module-lifetime accounting `DllCanUnloadNow`
# answers from: live objects, server locks, in-flight operations, and whether
# this module took a Winsock reference it must give back. A consumer linking
# the rlib has no `DllCanUnloadNow` and should not carry the counters --
# `common::overlapped` is on the submission path of `rio` and `tp` as well.
#
# It stays a feature because the counters live in this library (twelve
# `#[implement]` types carry a `ModuleRef`, and `LIVE_OPS` sits in
# `common::overlapped`), and only a feature can compile them in or out. What
# changed is that the feature no longer has to stand in for "this compile is
# the DLL": the separate package says that structurally.
dylib = ["comio", "counters"]

# I/O rings (`ioringapi.h`): batched file I/O through a submission and a
# completion queue shared with the kernel. Standalone -- its pump runs on the
# process default pool -- and with `tp` also on a runtime's pool.
ioring = [
    "windows/Win32_Foundation",
    "windows/Win32_Security",
    "windows/Win32_Storage_FileSystem",
    "windows/Win32_System_Threading",
    "windows/Win32_System_Memory",
    "windows/Win32_System_SystemInformation",
]

# DispatcherQueue (WinUI 3) runtime.
dq = [
    "dep:winio-winui3",
    "windows/Foundation",
]

# Registered I/O (RIO) sub-engine: a separate completion engine beside the
# overlapped/TP_IO core. Standalone — it pumps itself on the process default
# thread pool, or the queue can be driven by a caller's own IOCP, event or
# poll loop. Enabling `tp` as well adds a pump on tp's configurable pool and
# async accept/connect.
rio = [
    "windows/Win32_Foundation",
    "windows/Win32_Security",
    "windows/Win32_System_Threading",
    "windows/Win32_Networking_WinSock",
    "windows/Win32_System_IO",
    "windows/Win32_System_Memory",
    "windows/Win32_System_SystemInformation",
]

# tp's optional futures-io interop (AsyncRead/AsyncWrite <-> futures_io).
futures-io = ["tp", "dep:futures-io"]

# `bytes::Bytes` and `BytesMut` as IO buffers, beside `Vec<u8>`. Off by
# default: the buffer traits are open to any owned memory, and this is only
# the most common crate that has some.
bytes = ["dep:bytes"]
