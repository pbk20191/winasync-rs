[package]
name = "rustwinui3loop"
version = "0.1.0"
edition = "2024"

[dependencies]
windows-core = "0.62.2"
#windows = "0.62.2"

[dependencies.windows-link]
version = "0.2"

[dependencies.windows]
version = "0.62.2"
features = ["System", "Foundation", "System_Threading", "System_Threading_Core",
    "Networking_Sockets", "Storage_Streams", "Security_Credentials",
    "Security_Cryptography_Certificates",
    "ApplicationModel_Background", "Networking_Connectivity", "Web_Http", "Web_UI_Interop", "Web_UI",
    "Win32_Foundation", "Win32_System_Threading", "Win32_System_IO",
    "Win32_Storage_FileSystem", "Win32_Networking_WinSock", "Win32_Security",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Pipes", "Win32_System_WinRT",
]

[dependencies.windows-future]
version = "0.3.2"

#[build-dependencies.windows-app]
#git = "https://github.com/microsoft/windows-app-rs"
#features = [
#    "WindowsAppSdk_Foundation"
#]

#[build-dependencies.windows-bindgen]
#version = "0.66.0"

[dependencies.winio-winui3]
version = "0.4.0"
features = ["UI_Dispatching", "UI_Composition", "UI_Xaml"]


[dependencies.windows-threading]
version = "0.2.1"
#[target.'cfg(windows)'.build-dependencies]
#embed-resource = "3.0.9"

[dependencies.futures-io]
version = "0.3"
optional = true

[features]
# Bridge tp's AsyncRead/AsyncWrite to the futures-io ecosystem traits.
futures-io = ["dep:futures-io"]

[build-dependencies]
embed-resource = "3.0.9"