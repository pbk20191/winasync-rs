[package]
name = "rustwinui3loop"
version = "0.1.0"
edition = "2024"

# `cdylib` builds the same library a second time as a DLL, which is the form
# COM can load: `comio::activation` exports `DllGetClassObject` and friends
# from it, so the transports are reachable by `CoCreateInstance` from any
# language, not only by linking this crate. `lib` stays first — Rust callers,
# the demo bin and the test harness all use the rlib, and nothing about the
# cdylib changes what they see.
[lib]
crate-type = ["lib", "cdylib"]

# Renamed off the package name because the cdylib now claims
# `rustwinui3loop.pdb`, which a bin of the same name would also emit —
# cargo warns on the collision and says it may become a hard error. There is
# still only one bin, so `cargo run` is unaffected.
[[bin]]
name = "rustwinui3loop-demo"
path = "src/main.rs"

[dependencies]
windows-core = "0.62.2"

[dependencies.windows-link]
version = "0.2"

# `windows` is a base dep, but its feature surface is activated per crate-feature
# (tp / comio / dq) below — so e.g. a `tp`-only build pulls only the Win32 bits.
[dependencies.windows]
version = "0.62.2"
default-features = false
features = []

[dependencies.windows-future]
version = "0.3.2"
optional = true

[dependencies.winio-winui3]
version = "0.4.0"
features = ["UI_Dispatching", "UI_Composition", "UI_Xaml"]
optional = true

[dependencies.windows-threading]
version = "0.2.1"
optional = true

[dependencies.futures-io]
version = "0.3"
optional = true

[features]
default = ["tp", "dq", "comio"]

# Win32 thread-pool async runtime. Standalone: no winui3 / windows-future.
tp = [
    "windows/Win32_Foundation",
    "windows/Win32_Security",
    "windows/Win32_System_Threading",
    "windows/Win32_System_IO",
    "windows/Win32_Storage_FileSystem",
    "windows/Win32_Networking_WinSock",
    "windows/Win32_System_Pipes",
    "windows/Win32_System_Memory",
    "windows/Win32_System_SystemInformation",
    "windows/Win32_System_ApplicationInstallationAndServicing",
]

# WinRT-shaped COM streams over overlapped IO.
comio = [
    "dep:windows-future",
    "dep:windows-threading",
    "windows/Foundation",
    "windows/Storage_Streams",
    "windows/Win32_Foundation",
    "windows/Win32_System_Threading",
    "windows/Win32_System_IO",
    "windows/Win32_Storage_FileSystem",
    "windows/Win32_Networking_WinSock",
    "windows/Win32_System_Pipes",
    "windows/Win32_System_WinRT",
    "windows/Win32_Security",
    # The activation path: class factories, self-registration, module path.
    "windows/Win32_System_Com",
    "windows/Win32_System_Registry",
    "windows/Win32_System_LibraryLoader",
    # The late-binding path: IDispatch and the VARIANTs it speaks in.
    "windows/Win32_System_Ole",
    "windows/Win32_System_Variant",
]

# DispatcherQueue (WinUI 3) runtime; also carries the main.rs WinUI demo tail.
dq = [
    "dep:winio-winui3",
    "dep:windows-threading",
    "dep:windows-future",
    "windows/Foundation",
    "windows/System",
    "windows/System_Threading",
    "windows/System_Threading_Core",
    "windows/Networking_Sockets",
    "windows/Storage_Streams",
    "windows/Security_Credentials",
    "windows/Security_Cryptography_Certificates",
    "windows/ApplicationModel_Background",
    "windows/Networking_Connectivity",
    "windows/Web_Http",
    "windows/Web_UI_Interop",
    "windows/Web_UI",
    "windows/Win32_Foundation",
    "windows/Win32_System_WinRT",
    "windows/Win32_System_ApplicationInstallationAndServicing",
]

# Registered I/O (RIO) sub-engine: a separate completion engine beside the
# overlapped/TP_IO core. Standalone — it pumps itself on the process default
# thread pool, or the queue can be driven by a caller's own IOCP, event or
# poll loop. Enabling `tp` as well adds a pump on tp's configurable pool and
# async accept/connect.
rio = [
    "windows/Win32_Foundation",
    "windows/Win32_Security",
    "windows/Win32_System_Threading",
    "windows/Win32_Networking_WinSock",
    "windows/Win32_System_IO",
    "windows/Win32_System_Memory",
    "windows/Win32_System_SystemInformation",
]

# tp's optional futures-io interop (AsyncRead/AsyncWrite <-> futures_io).
futures-io = ["tp", "dep:futures-io"]

[build-dependencies]
embed-resource = "3.0.9"